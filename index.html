<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42 — Directory</title>
    <link rel="stylesheet" href="directory.css">
    <link rel="stylesheet" href="audio-widget.css">
</head>
<body>
    <a href="index.html" class="directory-logo-link">
        <img src="assets/42logowhite.png" alt="42" class="directory-logo">
    </a>

    <a href="#" class="directory-login">Log In</a>

    <div class="directory-stage">
        <div class="folder-row">
            <a href="clothing.html" class="folder-item">
                <span class="folder-icon"><span class="folder-tab"></span><span class="folder-body"></span></span>
                <span class="folder-label">Clothing</span>
            </a>
            <a href="events.html" class="folder-item">
                <span class="folder-icon"><span class="folder-tab"></span><span class="folder-body"></span></span>
                <span class="folder-label">Events</span>
            </a>
        </div>
        <div class="folder-row">
            <a href="calendar.html" class="folder-item">
                <span class="folder-icon"><span class="folder-tab"></span><span class="folder-body"></span></span>
                <span class="folder-label">Calendar</span>
            </a>
            <a href="about.html" class="folder-item">
                <span class="folder-icon"><span class="folder-tab"></span><span class="folder-body"></span></span>
                <span class="folder-label">About</span>
            </a>
            <a href="about.html#contact" class="folder-item">
                <span class="folder-icon"><span class="folder-tab"></span><span class="folder-body"></span></span>
                <span class="folder-label">Contact</span>
            </a>
        </div>
    </div>

    <button type="button" class="audio-widget" aria-label="Toggle background audio">
        <span class="audio-status-light"></span>
        <span class="audio-label">Audio: On</span>
    </button>

    <script src="audio.js"></script>
    <script src="pjax.js"></script>
</body>
</html>
